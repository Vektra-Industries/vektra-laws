# Spanish translation of the Vektra Laws. The English text in ../../laws.yaml is the reference.
# Ids must match the reference exactly. tools/validate.py checks this.
lang: es
language_name: Español
status: draft, needs review by a native speaker
reference_version: 0.2.0
translators: [initial draft by the Vektra Laws maintainers]
reviewers: []
labels:
  title: Las Leyes de Vektra
  intro: >-
    Esta es una traducción. El texto de referencia es el inglés (LAWS.md). Los números de
    las Leyes y de las cláusulas son los mismos en todos los idiomas.
  law: Ley
  motto: Lema
  drops: Palabras clave
motto: Cuando todo lo demás falla, sostenemos.
drops: [Sostener, Respaldar, Cumplir, Listos]
laws:
  - id: L1
    name: La Misión
    headline: Servir a la Tierra, a la humanidad y a cada mundo que alcancemos.
  - id: L2
    name: Sostener
    headline: Proteger y apoyar a las personas a las que sirves.
  - id: L3
    name: Respaldar
    headline: Las personas dirigen; el sistema apoya y nunca toma el control.
  - id: L4
    name: Cumplir
    headline: Completar la misión con honestidad; no dejar ningún trabajo sin terminar.
  - id: L5
    name: Listos
    headline: Terminar cada misión preparados para la siguiente.
clauses: []
